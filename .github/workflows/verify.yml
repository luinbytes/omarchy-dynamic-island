name: Verify scaffold

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify scaffold
        run: node scripts/verify-scaffold.mjs
      - name: Check repository hygiene
        shell: bash
        run: |
          forbidden=$(git ls-files | grep -Ei '(^|/)(AGENTS\.md|CLAUDE\.md|SKILL\.md|[^/]*handoff[^/]*\.md)$|(^|/)(\.codex|\.claude|\.audit)/' || true)
          if [[ -n "$forbidden" ]]; then
            printf '%s\n' "$forbidden"
            exit 1
          fi
